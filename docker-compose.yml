services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-heyue}
      POSTGRES_USER: ${POSTGRES_USER:-heyue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必须设置POSTGRES_PASSWORD}
    volumes:
      - heyue_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    profiles: ["production"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-heyue}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-heyue}
      APP_MASTER_KEY_BASE64: ${APP_MASTER_KEY_BASE64:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      APP_ORIGIN: ${APP_ORIGIN:-}
      COOKIE_SECURE: "true"
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
  web:
    profiles: ["production"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
  nginx:
    profiles: ["production"]
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_PATH:-./secrets/fullchain.pem}:/etc/nginx/tls/fullchain.pem:ro
      - ${TLS_KEY_PATH:-./secrets/privkey.pem}:/etc/nginx/tls/privkey.pem:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "-", "https://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  heyue_postgres:
